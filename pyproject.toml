[project]
name = "rx-online-judge"
version = "0.2.0"
description = "Container-based compiler judge for the Rx compiler course"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
rx-oj-worker = "rx_oj.worker:main"
rx-oj-admin = "rx_oj.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rx_oj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: integration tests requiring locally built judge images"]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
